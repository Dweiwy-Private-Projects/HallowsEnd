# Mob Spawning Configuration
mob-spawning:
  mob-cap-per-player: 4
  spawn-radius: 32
  harbinger-attack-chance: 0

  phase-2-mobs:
    BLIGHTED_HUSK:
      type: HUSK
      name: "<gold>Blighted Husk"
      health: 25.0
      spawn-chance: 0.6
    LINGERING_SOUL:
      type: SKELETON
      name: "<gray>Lingering Soul"
