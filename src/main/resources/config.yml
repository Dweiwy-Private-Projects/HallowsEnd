      type: SKELETON
      name: "<gradient:#ff0000:#8B0000><bold>Headless Horseman</bold></gradient>"
      health: 1024.0
      potion-effects: [ "REGENERATION:999999:2" ]
      speed-multiplier: 1.2
      scale: 1.5
      equipment:
        helmet: CARVED_PUMPKIN
        mainhand: DIAMOND_AXE
    MANOR_EVOKER:
      type: EVOKER
      name: "<dark_aqua><bold>Manor Guardian</bold>"
      health: 1000.0
      potion-effects: [ "REGENERATION:999999:2" ]
      speed-multiplier: 1.1
    WITCH_OF_THE_MIRE:
      type: ILLUSIONER
      name: "<dark_purple><bold>Warlock of the Mire</bold>"
      health: 1000.0
      potion-effects: [ "REGENERATION:999999:2" ]
      speed-multiplier: 1.0
      scale: 0.7
    HARBINGER:
      type: ALLAY
      name: "<gradient:#5a0000:#ff0000><bold>The Harbinger</bold></gradient>"
      health: 1000.0
      potion-effects: [ "INVISIBILITY:999999:0" ]
      scale: 4.0

