# Hallow's End Event Configuration

game-settings:
  # The permission node that will exclude a player from the event.
  staff-bypass-permission: "hallowsend.staff"

  # Duration of each phase in seconds.
  phase-durations:
    intro_cutscene: -1
    phase_1_calm: 900
    phase_2_awakening: 1200
    phase_3_blood_moon: 1200
    phase_4_rampage: 120
    phase_5_lms: -1

  # The location where all players will be teleported when the game starts.
  start-location:
    ==: org.bukkit.Location
    world: "world"
    x: 246.0
    y: -57.0
    z: 1020.0
    yaw: 180.0
    pitch: -5.0

  rampage:
    slowness-intensity: 4
    scary-sound-chance: 0.15
    jumpscare-chance: 0.10
    jumpscare-sound: "ENTITY_WITHER_HURT"
    jumpscare-head-texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmFlN2I1NTY2OTI3M2VkM2YxYjYxOGM2M2NhZGMxMzc5MzBjZDI5YTVhM2U5Y2M0OWE0ZWE0YjlkOTE4YTdmMyJ9fX0="
    pvp-skip-to-seconds: 10
    grace-period-seconds: 30
    # FIX #1: Added damage value for players caught outside
    damage-per-strike: 10.0 # (10.0 = 5 hearts)

  # Settings for the final battle in the church.
  final-battle:
    pvp-countdown-seconds: 10

  cutscene-start-location:
    ==: org.bukkit.Location
    world: "world"
    x: 246.0
    y: -55.0
    z: 1020.0
    pitch: -5.0
    yaw: 180.0

  cutscene-nodes:
    node-1:
      location:
        ==: org.bukkit.Location
        world: "world"
        x: 165.0
        y: -55.0
        z: 934.5
        pitch: 7.5
        yaw: 90.0
      duration: 10
      travel-time: 8
      title: "<gray>Whispers in the Dark"
      subtitle: "<gray>Who... or what... is that?"
      chat: |
        
        <st>                                                                                </st>
          <gray>You feel a presence nearby... a voice, old and cracked, whispers on the wind.
        
          <white><italic>"They are desperate... good."</italic>
        
          <gray>It seems to be watching some... <yellow>Villagers</yellow>?
          Perhaps they know more and talking to them will be beneficial.
        <st>                                                                                </st>

    node-2:
      location:
        ==: org.bukkit.Location
        world: "world"
        x: 247.5
        y: -27.0
        z: 918.5
        pitch: 20.4
        yaw: -139.2
      duration: 10
      travel-time: 8
      title: "<dark_red>The Hallowed Church"
      subtitle: "<gray>A broken sanctuary for a broken land."
      chat: |
        
        <st>                                                                                </st>
          <gray>A church, standing defiant against the encroaching rot.
        
          Its bell is silent, its pews empty... but you feel a faint aura of <gold>protection</gold>.
          A place to rest... a place to hide.
        <st>                                                                                </st>

    node-3:
      location:
        ==: org.bukkit.Location
        world: "world"
        x: 347.5
        y: -7.0
        z: 1120.5
        pitch: 19.2
        yaw: 22.6
      duration: 10
      travel-time: 8
      title: "<dark_purple>The Weeping Manor"
      subtitle: "<gray>A dark history sleeps within."
      chat: |
        
        <st>                                                                                </st>
          <gray>The manor looms over the village, a monument to forgotten sins.
        
          Lights flicker in the attic, though the place has been abandoned for years.
          <italic>Something</italic> powerful rests in its <dark_aqua>deepest chambers</dark_aqua>.
        <st>                                                                                </st>

    node-4:
      location:
        ==: org.bukkit.Location
        world: "world"
        x: 240.0
        y: -41.0
        z: 1153.0
        pitch: 9.2
        yaw: -34.5
      duration: 8
      travel-time: 8
      title: "<gold>The Warlock's Hut"
      subtitle: "<gray>What foul brews bubble within the hut?"
      chat: |
        
        <st>                                                                                </st>
          <gray>A crooked hut sinks into the mire, its chimney puffing strange, <green>green</green> smoke.
        
          The air smells of sweet flowers... and rotting flesh.
          Only a fool would challenge the <dark_aqua>Warlock</dark_aqua> in his domain.
        <st>                                                                                </st>

    node-5:
      location:
        ==: org.bukkit.Location
        world: "world"
        x: 113.0
        y: -33.0
        z: 1072.0
        pitch: 30.0
        yaw: 120.0
      duration: 8
      travel-time: 10
      title: "<gray>The Forgotten Grave"
      subtitle: "<gray>The dead are not at rest here."
      chat: |
        
        <st>                                                                                </st>
          <gray>Far from the village, a crypt lies in this land... a foul energy radiates from it.
        
          You hear a sound... a <red>scream</red>... but there is no one in sight.
          Only a <red>cage</red> where it appears to be coming from...
        <st>                                                                                </st>

    node-6:
      location:
        ==: org.bukkit.Location
        world: "world"
        x: 246.0
        y: -55.0
        z: 1020.0
        pitch: -5.0
        yaw: 180.0
      duration: 5
      travel-time: 8
      title: "<red><bold>The Night Begins..."
      subtitle: "<gray>May you be the one to survive it."
      chat: |
        
        <bold><red>                        Good luck.</red></bold>

# Server-side resource pack settings
